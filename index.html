<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이광형 | AI Researcher</title>
  <meta name="description" content="초분광 영상과 컴퓨터 비전을 활용하는 AI 연구자 이광형" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <!-- 왼쪽: 프로필 -->
    <aside class="side">
      <div class="avatar" id="avatar"></div>
      <h1 id="name"></h1>
      <p class="name-en" id="nameEn"></p>
      <p class="role" id="role"></p>
      <p class="org" id="org"></p>
      <nav class="links" id="links"></nav>
      <nav class="toc">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#publications">Publications</a>
        <a href="#experience">Experience</a>
        <a href="#education">Education</a>
        <a href="#awards">Awards</a>
      </nav>
    </aside>

    <!-- 오른쪽: 본문 -->
    <main class="main">
      <section id="about">
        <p class="tagline" id="tagline"></p>
        <div id="about-body"></div>
        <ul class="chips" id="interests"></ul>
      </section>

      <section id="projects">
        <h2>R&amp;D Projects</h2>
        <ul class="timeline" id="project-list"></ul>
      </section>

      <section id="publications">
        <h2>Publications</h2>
        <ol class="pubs" id="pub-list"></ol>
      </section>

      <section id="experience">
        <h2>Experience</h2>
        <ul class="timeline" id="exp-list"></ul>
      </section>

      <section id="education">
        <h2>Education</h2>
        <ul class="timeline" id="edu-list"></ul>
      </section>

      <section id="awards">
        <h2>Awards &amp; Certifications</h2>
        <ul class="timeline compact" id="award-list"></ul>
      </section>

      <footer class="foot">
        <span>© <span id="year"></span> <span id="foot-name"></span></span>
      </footer>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
